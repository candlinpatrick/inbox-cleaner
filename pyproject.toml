[project]
name = "inbox-cleaner"
version = "0.1.0"
description = "CLI tool to scan, triage, and clean up Gmail newsletter/promo clutter across multiple accounts"
requires-python = ">=3.11"
dependencies = [
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.0",
    "typer[all]>=0.9",
    "rich>=13.0",
    "httpx>=0.25",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
inbox-cleaner = "inbox_cleaner.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
